name: Build Kernel
on:
  push:
    branches: [ android16 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    uses: Picters/Picters_Kernel_CI_Center/.github/workflows/build_kernel.yml@main
    with:
      project: mi17_sm8850
      branch: ${{ github.ref_name }}
      ksu_variant: resukisu
      do_release: false
      apply_susfs: true
      apply_bbg: false
